; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-c6-devkitc-1

[env:esp32-c6-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino

board_build.flash_size = 16MB
board_upload.flash_size = 16MB

monitor_speed = 115200

build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps = moononournation/GFX Library for Arduino@^1.6.0
           lewisxhe/SensorLib@^0.4.1
           olikraus/U8g2@^2.36.18

board_build.filesystem = littlefs
board_build.partitions = partitions.csv

; test sul PC della logica senza hardware: pio test -e native
[env:native]
test_filter = test_protocollo
platform = native
test_build_src = yes
build_src_filter = -<*> +<ble/protocollo.cpp>

[env:native-player]
extends = env:native
test_filter = test_player
build_src_filter = -<*> +<player/player.cpp>
build_flags = -Itest/test_player/support
